spring.application.name=repaso-spring-security

# H2
spring.datasource.url=jdbc:h2:mem:securitydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ruta del Authorization Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080

# =========================================================
# OAuth2 Client
# =========================================================

spring.security.oauth2.client.registration.mi-cliente-web.client-id=mi-cliente-web
spring.security.oauth2.client.registration.mi-cliente-web.client-authentication-method=none
spring.security.oauth2.client.registration.mi-cliente-web.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.mi-cliente-web.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.mi-cliente-web.scope=read

spring.security.oauth2.client.provider.mi-cliente-web.authorization-uri=http://localhost:8080/oauth2/authorize
spring.security.oauth2.client.provider.mi-cliente-web.token-uri=http://localhost:8080/oauth2/token

# =========================================================
# Log
# =========================================================
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE